version: '3.8'

services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cerseuletras_app
    working_dir: /var/www/html
    volumes:
      - ./cerseuletras:/var/www/html
    depends_on:
      - db
    networks:
      - laravel-network
    environment:
      # Solo la URL. APP_ENV y APP_DEBUG viven en cerseuletras/.env, no aquí:
      # una variable de entorno del contenedor gana sobre el .env y además se
      # cuela en $_SERVER, donde PHPUnit no puede pisarla —con APP_ENV clavado,
      # la suite entera corría fuera del entorno de pruebas.
      - APP_URL=https://cerseuletras.unmsm.edu.pe

  # Nginx Web Server
  web:
    image: nginx:stable-alpine
    container_name: cerseuletras_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./cerseuletras:/var/www/html
      - ./docker/nginx/default-ssl.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl_sectigo:/etc/nginx/ssl_sectigo
      - ./docker/nginx/compression.conf:/etc/nginx/compression.conf
    depends_on:
      - app
    networks:
      - laravel-network
    environment:
      - NGINX_HOST=cerseuletras.unmsm.edu.pe

  # MySQL Database
  # Base de Datos
  db:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    container_name: cerseuletras_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-cerseuletras}
      MYSQL_USER: ${DB_USERNAME:-cerseu_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-user_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - laravel-network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db-data:

networks:
  laravel-network:
    driver: bridge
