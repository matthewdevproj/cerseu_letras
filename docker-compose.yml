version: '3.8'

services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: posgradoletras_app
    working_dir: /var/www/html
    volumes:
      - ./posgradoletras:/var/www/html
    depends_on:
      - db
    networks:
      - laravel-network
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://posgradoletras.unmsm.edu.pe

  # Nginx Web Server
  web:
    image: nginx:stable-alpine
    container_name: posgradoletras_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./posgradoletras:/var/www/html
      - ./docker/nginx/default-ssl.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl_sectigo:/etc/nginx/ssl_sectigo
      - ./docker/nginx/compression.conf:/etc/nginx/compression.conf
    depends_on:
      - app
    networks:
      - laravel-network
    environment:
      - NGINX_HOST=posgradoletras.unmsm.edu.pe

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: posgradoletras_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-posgradoletras}
      MYSQL_USER: ${DB_USERNAME:-posgrado_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-user_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - laravel-network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db-data:

networks:
  laravel-network:
    driver: bridge
