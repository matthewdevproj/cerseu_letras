# El sitio en Blade, servido aparte y solo en desarrollo.
#
# Mientras dura la migración hace falta poder mirar los dos a la vez: el
# dominio ya lo ocupa el sitio en Astro, así que Blade se atiende aquí, en el
# 8080, como referencia de diseño y para comprobar que no se queda nada por el
# camino. No se monta en producción, donde este puerto no existe.
#
# Desaparece al retirar las vistas de Blade.

server {
    listen 8080;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
    }
}
