# Capa de desarrollo. Se aplica encima de docker-compose.yml:
#
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Deliberadamente NO se llama docker-compose.override.yml. Con ese nombre
# Compose lo aplicaría solo, sin que nadie lo pida, y el servidor lo recogería
# al hacer git pull: quedaría en producción con APP_DEBUG=true, escupiendo
# trazas con credenciales en cada error. El nombre explícito obliga a pedirlo.
services:
  app:
    environment:
      # Solo la URL. APP_ENV y APP_DEBUG se ponen en cerseuletras/.env
      # (APP_ENV=local, APP_DEBUG=true): exportarlas aquí las mete en $_SERVER,
      # donde PHPUnit no puede sobrescribirlas ni con force="true", y la suite
      # acaba corriendo contra la base de desarrollo en vez de la de pruebas.
      - APP_URL=http://localhost
    ports:
      # Servidor de Vite, para `npm run dev` con recarga en caliente.
      - "5173:5173"
    volumes:
      # vendor/ y node_modules/ salen del bind mount y viven en volúmenes
      # dentro del contenedor.
      #
      # No es por rendimiento: sobre el bind mount de Docker Desktop en Windows,
      # readdir() TRUNCA los directorios grandes. En vendor/owenvoke/blade-
      # fontawesome/resources/svg/solid, scandir() ve los 1758 SVG pero
      # FilesystemIterator —el que usan Symfony Finder y, por debajo, blade-icons—
      # devuelve solo 926, siempre los mismos. El resultado es que la mitad de
      # los iconos no existe para la aplicación y cualquier página que use uno de
      # ellos revienta con «Unable to locate a class or view for component».
      #
      # Con volúmenes nombrados los ficheros están en el sistema de archivos de
      # Linux y se listan enteros. A cambio, `composer install` y `npm install`
      # hay que correrlos DENTRO del contenedor —que es justo lo que dice el
      # README— y el editor del host no ve esas carpetas.
      - vendor-data:/var/www/html/vendor
      - node-modules:/var/www/html/node_modules

  web:
    environment:
      # En desarrollo el sitio se sirve por localhost, no por el dominio.
      - NGINX_SERVER_NAMES=localhost 127.0.0.1
    volumes:
      # La conf de producción pide los certificados de /etc/nginx/ssl_sectigo,
      # que no están en el repositorio. Sin ellos nginx ni siquiera arranca, así
      # que en desarrollo se sirve la variante sin TLS por el puerto 80.
      # Compose fusiona los volúmenes por ruta de destino, de modo que esta
      # línea sustituye a la del compose base en lugar de sumarse.
      - ./docker/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template

volumes:
  vendor-data:
  node-modules:
